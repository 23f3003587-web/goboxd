name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t goboxd:${GITHUB_REF_NAME} .
      - name: Show image summary
        run: docker images --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'
