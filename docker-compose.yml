services:
  goboxd:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: goboxd:dev
    container_name: goboxd
    ports:
      - "8080:8080"
    privileged: true
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    restart: unless-stopped
    # volumes:
    #   - .:/app   # Uncomment for live reload during dev

  # Tools container for make test / lint / integration
  tools:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    image: goboxd-tools:dev
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - .:/app:ro
    # NO entrypoint or command override — this fixes the sleep error
    tty: true
    depends_on:
      - goboxd

networks:
  default:
    name: goboxd_network
    driver: bridge