name: "goboxd"
description: "Secure sandbox for goboxd code execution"

mode: ONCE
hostname: "goboxd"
cwd: "/app"

time_limit: 30
max_cpus: 1

keep_env: false
envar: "LANG=C.UTF-8"
envar: "PATH=/usr/bin:/bin:/usr/local/bin"

# Namespaces
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true

# Read-only system directories
mount { dst: "/bin";   src: "/bin";   is_bind: true }
mount { dst: "/usr";   src: "/usr";   is_bind: true }
mount { dst: "/lib";   src: "/lib";   is_bind: true }
mount { dst: "/lib64"; src: "/lib64"; is_bind: true; mandatory: false }

# Allow /etc for basic system info (but read-only)
mount { dst: "/etc"; src: "/etc"; is_bind: true; rw: false }

# Working directory is mounted dynamically by the executor.
# The actual /app bind mount is provided at runtime via nsjail -B.

# Temporary filesystem
mount { dst: "/tmp"; fstype: "tmpfs"; rw: true }

# Random device
mount { dst: "/dev/urandom"; src: "/dev/urandom"; is_bind: true; rw: true }

# Minimal proc
mount { dst: "/proc"; fstype: "proc"; rw: false }

seccomp_string: "DEFAULT ALLOW"
